name: Container experiments

# Started by hand only (Actions -> Container experiments -> Run workflow); runs on the self-hosted thesis laptop.
on:
  workflow_dispatch:
    inputs:
      study:
        description: "test = short trial run; images = build, size, startup (~6 h); load = concurrency series (~9 h); soak = long runs (~5 h); nmt = Native Memory Tracking runs (~2 h)"
        type: choice
        options: [test, images, load, soak, nmt]
        default: test
      repeats:
        description: "Runs per variant (images: default 5; load: 10 is the study design)"
        type: number
        default: 5

# Never two measurements at the same time on the laptop.
concurrency:
  group: thesis-laptop
  cancel-in-progress: false

env:
  K6_VERSION: v2.4.0
  K6_SHA256: aaa90b3afc336faf90172c7addf45c4f41305f6f188e3d564f79466e80ac68e3
  MIN_FREE_GB: 15

defaults:
  run:
    shell: powershell

jobs:
  measure:
    runs-on: [self-hosted, thesis-laptop]
    timeout-minutes: 1800
    steps:
      - uses: actions/checkout@v7

      - name: Check preconditions (power, disk space, no other containers)
        run: |
          $battery = Get-CimInstance Win32_Battery | Select-Object -First 1
          if ($battery -and $battery.BatteryStatus -eq 1) { throw 'The laptop is running on battery (CPU throttled) - plug it in' }
          $free = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
          Write-Host "Free disk space on C: $free GB"
          if ($free -lt $env:MIN_FREE_GB) { throw "Only $free GB free, need $env:MIN_FREE_GB GB - run 'docker image prune -a' and 'docker builder prune -a'" }
          $allowed = 'esg-postgres', 'esg-rabbitmq', 'esg-company-service', 'esg-registry'
          $others = @(docker ps --format '{{.Names}}' | Where-Object { $allowed -notcontains $_ })
          if ($others.Count -gt 0) { throw "Other containers are running and would distort the measurement: $($others -join ', ') - stop them first" }

      - name: Download k6 (pinned version, checksum verified)
        run: |
          $dir = 'experiments\container\tools'
          New-Item -ItemType Directory -Force $dir | Out-Null
          [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
          $zip = Join-Path $env:RUNNER_TEMP 'k6.zip'
          Invoke-WebRequest "https://github.com/grafana/k6/releases/download/$env:K6_VERSION/k6-$env:K6_VERSION-windows-amd64.zip" -OutFile $zip -UseBasicParsing
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:K6_SHA256) { throw "k6 checksum mismatch: $hash" }
          $x = Join-Path $env:RUNNER_TEMP 'k6'
          Expand-Archive $zip -DestinationPath $x -Force
          Copy-Item (Get-ChildItem $x -Recurse -Filter k6.exe).FullName $dir -Force
          & "$dir\k6.exe" version

      - name: Record environment
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force results | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          @(
            "date:        $((Get-Date).ToUniversalTime().ToString('s'))Z"
            "study:       ${{ inputs.study }} (repeats ${{ inputs.repeats }})"
            "commit:      $env:GITHUB_SHA"
            "windows:     $($os.Caption) $($os.Version)"
            "cpu:         $($cpu.Name) ($($cpu.NumberOfCores) cores, $($cpu.NumberOfLogicalProcessors) threads)"
            "ram:         $([math]::Round($os.TotalVisibleMemorySize / 1MB, 1)) GB"
            "power plan:  $(powercfg /getactivescheme)"
            "docker:      $(docker version --format '{{.Server.Platform.Name}}, engine {{.Server.Version}}')"
            "docker vm:   $(docker info --format '{{.NCPU}} CPUs, {{.MemTotal}} bytes memory, kernel {{.KernelVersion}}')"
            "compose:     $(docker compose version --short)"
            "python:      $(python --version 2>&1)"
            "scipy:       $(python -c 'import scipy; print(scipy.__version__)')"
            "k6:          $(& experiments\container\tools\k6.exe version)"
            "powershell:  $($PSVersionTable.PSVersion)"
          ) | Tee-Object -FilePath results\environment.txt
          exit 0

      # Success criterion of every measure step: measurements were written (warnings for single runs stay in the log).
      - name: Measure (short trial run)
        if: inputs.study == 'test'
        run: |
          .\experiments\container\measure-images.ps1 -Services report-service -Phases build,size,startup -Repeats 1 -Label test -OutDir results
          .\experiments\container\measure-images.ps1 -Services esg-score-service -Variants multi-jre,multi -Phases build -Repeats 1 -Label prep -OutDir prep
          .\experiments\container\measure-images.ps1 -Phases load -LoadLevels 10,400 -LoadRepeats 1 -LoadDuration 15s -Label test-load -OutDir results
          .\experiments\container\measure-images.ps1 -Phases soak -LoadVariants multi -SoakDuration 2m -SoakRepeats 1 -Label test-soak -OutDir results
          if (-not (Get-ChildItem results -Filter 'measurements-*.csv')) { throw 'No measurements were written' }
          exit 0

      - name: Measure (Study 1, image part)
        if: inputs.study == 'images'
        run: |
          .\experiments\container\measure-images.ps1 -Phases build,size,startup -Repeats ${{ inputs.repeats }} -Label images -OutDir results
          if (-not (Get-ChildItem results -Filter 'measurements-*.csv')) { throw 'No measurements were written' }
          exit 0

      # load and soak need the two esg-score-service runtime images; their build here is not part of the results
      - name: Build the load-test images (not measured)
        if: inputs.study == 'load' || inputs.study == 'soak' || inputs.study == 'nmt'
        run: |
          .\experiments\container\measure-images.ps1 -Services esg-score-service -Variants multi-jre,multi -Phases build -Repeats 1 -Label prep -OutDir prep
          exit 0

      - name: Measure (Study 1, concurrency series)
        if: inputs.study == 'load'
        run: |
          .\experiments\container\measure-images.ps1 -Phases load -LoadRepeats ${{ inputs.repeats }} -Label load -OutDir results
          if (-not (Get-ChildItem results -Filter 'measurements-*.csv')) { throw 'No measurements were written' }
          exit 0

      - name: Measure (Study 1, long runs)
        if: inputs.study == 'soak'
        run: |
          .\experiments\container\measure-images.ps1 -Phases soak -Label soak -OutDir results
          if (-not (Get-ChildItem results -Filter 'measurements-*.csv')) { throw 'No measurements were written' }
          exit 0

      - name: Measure (Study 1, Native Memory Tracking)
        if: inputs.study == 'nmt'
        run: |
          .\experiments\container\measure-images.ps1 -Phases load -Nmt -LoadLevels 50,200 -LoadRepeats ${{ inputs.repeats }} -Label nmt -OutDir results
          if (-not (Get-ChildItem results -Filter 'measurements-*.csv')) { throw 'No measurements were written' }
          exit 0

      - name: Statistical analysis
        if: always()
        run: |
          if (-not (Get-ChildItem results -Filter 'measurements-*.csv')) { Write-Warning 'No measurements to analyse'; exit 0 }
          python experiments\analysis\analyze.py results --out results\report
          if ($LASTEXITCODE -ne 0) { throw 'analyze.py failed' }
          Get-Content results\report\report.md -Encoding UTF8 | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit 0

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ inputs.study }}-${{ github.run_number }}
          path: results/

      - name: Stop experiment containers
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          docker rm -f esg-startup-test esg-registry 2>$null | Out-Null
          docker compose down 2>$null | Out-Null
          exit 0
