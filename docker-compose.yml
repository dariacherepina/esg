services:
  postgres:
    image: postgres:16-alpine
    container_name: esg-postgres
    environment:
      POSTGRES_USER: esg
      POSTGRES_PASSWORD: esg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
