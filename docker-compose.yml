services:
  postgres:
    image: postgres:16-alpine
    container_name: esg-postgres
    environment:
      POSTGRES_USER: esg
      POSTGRES_PASSWORD: esg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esg"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: esg-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: esg
      RABBITMQ_DEFAULT_PASS: esg
    ports:
      - "5672:5672"     # AMQP (services)
      - "15672:15672"   # management UI: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Web UI — only started on request: docker compose --profile ui up -d
  # Not part of the experiments. Forwards /api/... to the services running on the host.
  frontend:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: esg-frontend
    container_name: esg-frontend
    ports:
      - "8080:8080"   # http://localhost:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
  prometheus:
    image: prom/prometheus:latest
    container_name: esg-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:latest
    container_name: esg-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  postgres-data:

