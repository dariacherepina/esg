services:
  postgres:
    image: postgres:16-alpine
    container_name: esg-postgres
    environment:
      POSTGRES_USER: esg
      POSTGRES_PASSWORD: esg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esg"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: esg-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: esg
      RABBITMQ_DEFAULT_PASS: esg
    ports:
      - "5672:5672"     # AMQP (services)
      - "15672:15672"   # management UI: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
