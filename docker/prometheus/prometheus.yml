global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'company-service'
    static_configs:
      - targets: ['company-service:8081']
    metrics_path: '/actuator/prometheus'

  - job_name: 'esg-score-service'
    static_configs:
      - targets: ['esg-score-service:8082']
    metrics_path: '/actuator/prometheus'

  - job_name: 'portfolio-service'
    static_configs:
      - targets: ['portfolio-service:8083']
    metrics_path: '/actuator/prometheus'

  - job_name: 'report-service'
    static_configs:
      - targets: ['report-service:8084']
    metrics_path: '/actuator/prometheus'